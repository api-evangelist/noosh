accessModel:
  pricing: contact-sales
  onboarding: sales-gate
  trial: false
  try_now: false
  public: false
  label: Enterprise, contact sales
  confidence: high
  source:
  - https://www.noosh.com/pricing/
  - https://nooshauth.noosh.com/login
  - https://www.noosh.com/contact/
  generated: '2026-08-13'
  method: searched
  note: >-
    Corrected from the mechanical derivation, which read the API's HTTP Basic scheme as self-serve
    signup. Probed 2026-08-13: noosh.com/pricing/ returns 404, there is no sign-up route anywhere on
    noosh.com (nooshauth.noosh.com serves a login only), and the site's call to action is a contact
    form. The API contract is public and anonymously readable at api.noosh.com/api/swagger.json, but
    every route requires customer credentials — api.noosh.com answers 403 to unauthenticated callers.
