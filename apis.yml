apis:
- name: Noosh API
  description: >-
    The Noosh API is the integration surface behind Noosh's marketing-execution platform — the API
    Noosh's own partners page credits for "over 60 integrations to enterprise software systems". It is
    published as a Swagger 2.0 document with 86 paths and 107 operations across 25 tags: Project, Spec,
    Spec Template, Estimate, RFE, Rfq, Quote, Order, Shipment, Invoice, File, Task, Time Card, Team
    Member, Team Member Role, Contact, Country, Exchange Rate, Workgroup, Workgroup Members, Project
    Category, Project Status, Deactivation Reason, User Fields and My Info. Everything is scoped to a
    workgroup — workgroup_id is a path parameter on 105 of the 107 operations — and most resources sit
    under a project. Authentication is HTTP Basic with no scope model. Four URI-path generations (/v1,
    /1.1, /1.2 and /3) are served simultaneously with no operation marked deprecated. The API documents
    no pagination, no idempotency key, no webhooks and no rate limits.
  humanURL: https://api.noosh.com/api/developer/index.html
  baseURL: https://api.noosh.com
