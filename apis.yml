x-pointers-deliberately-omitted:
- type: MCPServer
  reason: >-
    Noosh ships no MCP server. mcp/noosh-mcp.yml carries deployment.mode none and a candidate tool
    list derived from the OpenAPI. The only server that exists is a third-party generated one
    (github.com/ag2-mcp-servers/noosh-api-application, built by mcp.ag2.ai from the public Swagger
    document) and it is not a Noosh product.
- type: SDKs
  reason: >-
    No first-party client library exists in npm, PyPI, RubyGems, Packagist or crates.io, and there is
    no github.com/noosh organisation. The only npm package, @datafire/noosh, is a third-party
    generated wrapper last published 2020-12-21.
- type: WellKnown
  reason: >-
    Every /.well-known/ path 404s on noosh.com/www.noosh.com and 403s on api.noosh.com. The 200s on
    nooshauth.noosh.com are the login SPA's HTML catch-all, not documents.
- type: AgentCard
  reason: /.well-known/agent-card.json and /.well-known/agent.json miss on every Noosh host.
- type: Idempotency
  reason: No Idempotency-Key header or parameter appears in any of the 107 published operations.
- type: Security
  reason: No security.txt, no disclosure page, no bug bounty. probe-security-programs.py returned vdp=none.
- type: TrustCenter
  reason: trust.noosh.com, security.noosh.com, noosh.com/trust and noosh.com/security all return 404.
- type: Compliance
  reason: No certification (SOC 2, ISO 27001, PCI, HIPAA, FedRAMP) is named anywhere on the public site.
- type: Deprecation
  reason: No deprecation policy, no Sunset header, and zero operations marked deprecated despite four live path generations.
- type: AsyncAPI / Webhooks
  reason: No events, callbacks or webhook documentation anywhere in the contract or on the site.
- type: Pricing / SignUp
  reason: noosh.com/pricing/ returns 404 and there is no self-serve sign-up — login only.
- type: GitHubOrganization
  reason: api.github.com/orgs/noosh returns 404.
- type: Postman
  reason: No public Noosh collection or workspace found in Postman search.
