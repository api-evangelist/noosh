aid: noosh
name: Noosh
description: Noosh is a marketing execution and print/procurement management platform that gives
  enterprise marketing teams visibility and control over campaigns spanning direct mail, print, and
  point-of-sale (POS) materials. The software coordinates collaborative marketing workflows, agency
  and supplier performance tracking, vendor diversity management, and cost, quality, time, and
  sustainability data, and integrates with procurement and other enterprise systems. Noosh publishes
  a public, machine-readable Swagger 2.0 contract for the Noosh API at api.noosh.com — 86 paths, 107
  operations and 214 schema definitions covering projects, specs, RFQs, quotes, estimates, buy and
  sell orders, shipments, invoices, files, tasks, time cards and workgroups — with a Swagger UI as its
  only documentation surface. There is no developer portal, no SDK in any registry, no published
  pricing and no rate limits; authentication is HTTP Basic and every route is customer-credentialed.
  Noosh was surfaced as a portfolio company of Accel and profiled in the API Evangelist network.
