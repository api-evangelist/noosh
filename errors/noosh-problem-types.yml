note: 'Noosh does NOT use RFC 9457 problem+json. Every documented 4xx/5xx response returns the same envelope, HTTPStatusVO (Java type com.noosh.core.vo.HTTPStatusVO), with two fields: status_code (integer)
  and status_reason (string). Some resource-scoped variants add identity fields (SpecHTTPStatusVO adds spec_id/spec_name, WorkgroupHTTPStatusVO adds workgroup_id/workgroup_name). The spec documents only
  404, 422 and 500; it documents no 401/403 response even though HTTP Basic authentication is required and unauthenticated calls to api.noosh.com are answered 403 {"message":"Forbidden"} by AWS API Gateway.
  Noosh publishes no error-code reference in its help center (a search of support.noosh.com for "API", "swagger" and "webhook" returned no developer articles), so titles and remediation below are the spec
  descriptions verbatim, not enriched.'
