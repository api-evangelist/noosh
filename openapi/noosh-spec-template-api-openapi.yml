            text/csv:
              schema:
                $ref: '#/components/schemas/HTTPStatusVO'
            '*/*':
              schema:
                $ref: '#/components/schemas/HTTPStatusVO'
components:
  schemas:
    SpecTemplateSimpleVO:
      properties:
        created_by:
          description: ''
          $ref: '#/components/schemas/PersonVO'
        created_date:
          type: string
          format: date
          description: ''
        is_active:
          type: boolean
          example: 'false'
          description: ''
        is_externally_published:
          type: boolean
          example: 'false'
          description: ''
        is_locked:
          type: boolean
          example: 'false'
          description: ''
        last_updated_date:
          type: string
          format: date
          description: ''
        spec_template_id:
          type: integer
          format: int64
          example: '1'
          description: ''
        spec_template_name:
          type: string
          example: sample spec_template_name
          description: ''
      description: 'Java type: com.noosh.nooshapi.vo.SpecTemplateSimpleVO'
    SpecTemplateDetailVO:
      properties:
        created_by:
          description: ''
          $ref: '#/components/schemas/PersonVO'
        created_date:
          type: string
          format: date
          description: ''
        is_active:
          type: boolean
          example: 'false'
          description: ''
        is_externally_published:
          type: boolean
          example: 'false'
          description: ''
        is_locked:
          type: boolean
          example: 'false'
          description: ''
        last_updated_date:
          type: string
          format: date
          description: ''
        product_type:
          type: string
          example: sample product_type
          description: ''
        product_type_info:
          description: ''
          $ref: '#/components/schemas/ProductTypeVO'
        spec_template_id:
          type: integer
          format: int64
          example: '1'
          description: ''
        spec_template_name:
          type: string
          example: sample spec_template_name
          description: ''
        spec_type:
          description: ''
          $ref: '#/components/schemas/SpecTypeVO'
      description: 'Java type: com.noosh.nooshapi.vo.SpecTemplateDetailVO'
    ProductTypeVO:
      properties:
        label:
          type: string
          example: sample label
          description: ''
        product_type_id:
          type: integer
          format: int64
          example: '1'
          description: ''
      description: 'Java type: com.noosh.nooshapi.vo.ProductTypeVO'
    PersonVO:
      properties:
        email:
          type: string
          example: sample email
          description: ''
        first_name:
          type: string
          example: sample first_name
          description: ''
        last_name:
          type: string
          example: sample last_name
          description: ''
        middle_name:
          type: string
          example: sample middle_name
          description: ''
      description: 'Java type: com.noosh.nooshapi.vo.PersonVO'
    SpecTemplateListVO:
      properties:
        results:
          type: array
          description: ''
          items:
            $ref: '#/components/schemas/SpecTemplateSimpleVO'
        status_code:
          type: integer
          format: int32
          example: '1'
          description: ''
        status_reason:
          type: string
          example: sample status_reason
          description: ''
      description: 'Java type: com.noosh.nooshapi.vo.SpecTemplateListVO'
    HTTPStatusVO:
      properties:
        status_code:
          type: integer
          format: int32
          example: '1'
          description: ''
        status_reason:
          type: string
          example: sample status_reason
          description: ''
      description: 'Java type: com.noosh.core.vo.HTTPStatusVO'
    SpecTemplateExpandVO:
      properties:
        result:
          description: ''
          $ref: '#/components/schemas/SpecTemplateDetailVO'
        status_code:
          type: integer
          format: int32
          example: '1'
          description: ''
        status_reason:
          type: string
          example: sample status_reason
          description: ''
      description: 'Java type: com.noosh.nooshapi.vo.SpecTemplateExpandVO'
    SpecTypeVO:
      properties:
        spec_type_id:
          type: integer
          format: int64
          example: '1'
          description: ''
        spec_type_name:
          type: string
          example: sample spec_type_name
          description: ''
      description: 'Java type: com.noosh.nooshapi.vo.SpecTypeVO'
  securitySchemes:
