openapi: 3.2.0
info:
  description: Full description of Noosh API
  version: '1.0'
  title: Noosh API application Spec Template API
  contact: {}
servers:
- url: http://example.com:80/v1
tags:
- name: Spec Template
paths:
  /v1/workgroups/{workgroup_id}/specTemplates:
    get:
      tags:
      - Spec Template
      summary: List Spec Templates of Workgroup Level
      operationId: getSpecTemplateList
      parameters:
      - name: workgroup_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful retrieval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecTemplateListVO'
            application/x-json-smile:
              schema:
                $ref: '#/components/schemas/SpecTemplateListVO'
            application/xml:
              schema:
                $ref: '#/components/schemas/SpecTemplateListVO'
            text/xml:
              schema:
                $ref: '#/components/schemas/SpecTemplateListVO'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/SpecTemplateListVO'
            text/x-yaml:
              schema:
                $ref: '#/components/schemas/SpecTemplateListVO'
            text/csv:
              schema:
                $ref: '#/components/schemas/SpecTemplateListVO'
            '*/*':
              schema:
                $ref: '#/components/schemas/SpecTemplateListVO'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPStatusVO'
            application/x-json-smile:
              schema:
                $ref: '#/components/schemas/HTTPStatusVO'
            application/xml:
              schema:
                $ref: '#/components/schemas/HTTPStatusVO'
            text/xml:
              schema:
                $ref: '#/components/schemas/HTTPStatusVO'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/HTTPStatusVO'
            text/x-yaml:
              schema:
                $ref: '#/components/schemas/HTTPStatusVO'
            text/csv:
              schema:
                $ref: '#/components/schemas/HTTPStatusVO'
            '*/*':
              schema:
                $ref: '#/components/schemas/HTTPStatusVO'
        '404':
          description: There are not any result matching your search condition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPStatusVO'
            application/x-json-smile:
              schema:
                $ref: '#/components/schemas/HTTPStatusVO'
            application/xml:
              schema:
                $ref: '#/components/schemas/HTTPStatusVO'
            text/xml:
              schema:
                $ref: '#/components/schemas/HTTPStatusVO'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/HTTPStatusVO'
            text/x-yaml:
              schema:
                $ref: '#/components/schemas/HTTPStatusVO'
            text/csv:
              schema:
                $ref: '#/components/schemas/HTTPStatusVO'
            '*/*':
              schema:
                $ref: '#/components/schemas/HTTPStatusVO'
  /v1/workgroups/{workgroup_id}/specTemplates/{spec_template_id}:
    get:
      tags:
      - Spec Template
      summary: Get a specific Spec Template
      operationId: getSpecTemplate
      parameters:
      - name: workgroup_id
        in: path
        required: true
        schema:
          type: string
      - name: spec_template_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful retrieval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecTemplateExpandVO'
            application/x-json-smile:
              schema:
                $ref: '#/components/schemas/SpecTemplateExpandVO'
            application/xml:
              schema:
                $ref: '#/components/schemas/SpecTemplateExpandVO'
            text/xml:
              schema:
